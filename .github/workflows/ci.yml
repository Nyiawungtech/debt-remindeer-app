name: Verify SettleUp
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Use the public frontend configuration
        run: cp .env.example .env.production
      - run: npm run build
      - run: npm run backend:check
      - name: Verify the published release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-live]')
        run: node scripts/verify-live.mjs
